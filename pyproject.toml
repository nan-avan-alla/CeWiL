[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cewil-engineering-os"
version = "0.1.0"
description = "Governed workflow foundation for civil engineering operations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
